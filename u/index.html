<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mystory</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!--
  WI-17 §1.2: the page someone without the app sees for https://themystory.app/u/<handle>.
  Cloudflare rewrites every /u/* to this one file (status 200, address bar unchanged), so the handle is read from
  the address. It sends no request of its own and shows no personal data: the handle is decoded, then only
  A–Z a–z 0–9 _ are kept, at most 20 characters; fewer than 3 left (or no handle) shows the general introduction.
  Text is set with textContent only, never as HTML.
  When the app is on the App Store, set APP_STORE_URL below (one constant) and the button becomes that link.
-->
<main class="share-page">
  <svg class="share-seal" viewBox="0 0 64 64" width="72" height="72" role="img" aria-label="Mystory">
    <circle cx="32" cy="32" r="30" fill="#a8322e"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#faf8f4" stroke-opacity=".55" stroke-width="1.5"/>
    <text x="32" y="41" text-anchor="middle" font-size="26" font-weight="700" fill="#faf8f4"
          font-family="Georgia, 'Times New Roman', serif">M</text>
  </svg>
  <h1 id="title">Mystory</h1>
  <p id="intro" class="muted">iOS 日記 App・免費・無廣告・無內購 / A free iOS diary app</p>
  <p><a id="download" class="share-download" aria-disabled="true">即將上架 / Coming soon</a></p>
  <p id="hint" class="muted"></p>
</main>

<script>
(function () {
  "use strict";
  // Set to the App Store address once the app is released; null keeps the button "Coming soon" and not clickable.
  var APP_STORE_URL = null;

  var TEXT = {
    zh: {
      lang: "zh-Hant",
      viewOn: function (h) { return "在 mystory 上看 @" + h; },
      general: "mystory",
      intro: "一本放在手機裡的手寫日記。iOS App，免費、無廣告、無內購。",
      soon: "即將上架",
      download: "在 App Store 下載",
      hint: "已經安裝了？請用 iPhone 的相機掃 QR code，或在 iPhone 上點這個連結。"
    },
    en: {
      lang: "en",
      viewOn: function (h) { return "See @" + h + " on mystory"; },
      general: "mystory",
      intro: "A handwritten-feeling diary on your phone. Free on iOS, with no ads and no in-app purchases.",
      soon: "Coming soon",
      download: "Download on the App Store",
      hint: "Already installed? Scan the QR code with your iPhone's camera, or tap this link on your iPhone."
    }
  };

  /** The handle in /u/<handle>[/…]: decoded, only A–Z a–z 0–9 _ kept, at most 20; "" when fewer than 3 remain. */
  function handleFrom(path) {
    var m = /^\/u\/([^\/]*)/.exec(path || "");
    if (!m || m[1] === "index.html") { return ""; }
    var raw = m[1];
    try { raw = decodeURIComponent(raw); } catch (e) { /* keep it undecoded; the filter below still applies */ }
    var kept = raw.replace(/[^A-Za-z0-9_]/g, "").slice(0, 20);
    return kept.length >= 3 ? kept : "";
  }

  var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
  var t = /^zh/i.test(langs[0] || "") ? TEXT.zh : TEXT.en;
  var handle = handleFrom(location.pathname);

  document.documentElement.lang = t.lang;
  var title = handle ? t.viewOn(handle) : t.general;
  document.title = handle ? title : "mystory";
  document.getElementById("title").textContent = title;
  // With a handle the page is only the seal, the line, the button and the hint (spec §1.2); the introduction is
  // the no-handle case's.
  var intro = document.getElementById("intro");
  if (handle) { intro.parentNode.removeChild(intro); } else { intro.textContent = t.intro; }
  document.getElementById("hint").textContent = t.hint;

  var button = document.getElementById("download");
  if (APP_STORE_URL) {
    button.textContent = t.download;
    button.setAttribute("href", APP_STORE_URL);
    button.removeAttribute("aria-disabled");
  } else {
    button.textContent = t.soon;
  }
})();
</script>
</body>
</html>
